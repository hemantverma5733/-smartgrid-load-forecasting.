version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: smartgrid_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartgrid
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smartgrid_redis
    restart: always
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: smartgrid_api
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/workspace
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/smartgrid
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery_worker:
    build: .
    container_name: smartgrid_worker
    restart: always
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info
    volumes:
      - .:/workspace
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/smartgrid
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - db

  celery_beat:
    build: .
    container_name: smartgrid_beat
    restart: always
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info
    volumes:
      - .:/workspace
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/smartgrid
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - db

  dashboard:
    build: .
    container_name: smartgrid_dashboard
    restart: always
    command: streamlit run dashboard/dashboard_app.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - .:/workspace
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://web:8000/api/v1
    depends_on:
      - web

volumes:
  postgres_data:
